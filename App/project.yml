# Génère le projet Xcode : xcodegen generate --spec App/project.yml
#
# Le projet est décrit ici plutôt que dans un .xcodeproj versionné : le
# project.pbxproj est illisible en diff et provoque des conflits à la moindre
# modification. Ce fichier est la source de vérité, le .xcodeproj un artefact.
#
# Étape en cours : valider la plomberie système (App Group, entitlements,
# enregistrement du domaine) avec une extension qui sert des données factices.
# BrailliantKit sera branché dessous une fois cette base confirmée.

name: BrailliantConnect
options:
  bundleIdPrefix: com.mathieumartin
  deploymentTarget:
    macOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "633EG76YX5"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # --- Application hôte -------------------------------------------------------
  # Une extension File Provider ne peut pas exister seule : elle est livrée dans
  # une app, qui est aussi le seul endroit d'où l'on peut déclarer le domaine
  # via NSFileProviderManager.
  BrailliantConnect:
    type: application
    platform: macOS
    sources:
      - path: BrailliantConnect
    dependencies:
      - target: FileProviderExtension
        embed: true
        # « Embed Without Signing » : prescrit par la documentation Apple.
        # Re-signer l'extension à l'embarquement lui fait perdre ses propres
        # entitlements au profit de ceux de l'app hôte.
        codeSign: false
    postBuildScripts:
      - name: Embarquer libmtp et libusb
        script: |
          DEST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for lib in libmtp.9.dylib libusb-1.0.0.dylib; do
            cp -f "$SRCROOT/../Vendor/$lib" "$DEST/$lib"
            # Signer chaque bibliothèque séparément. Une signature « --deep »
            # appliquée à l'application entière écraserait les entitlements de
            # l'extension, qui refuserait alors de se charger.
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/$lib"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieumartin.BrailliantConnect
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: BrailliantConnect/BrailliantConnect.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES

  # --- Extension File Provider ------------------------------------------------
  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
      # La couche MTP est compilée dans l'extension : c'est elle qui parle à
      # la plage, l'application hôte ne fait que déclarer le domaine.
      - path: ../Sources/BrailliantKit
      - path: ../Sources/CMTP
        buildPhase: none
    postBuildScripts:
      - name: Embarquer libmtp et libusb
        script: |
          DEST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for lib in libmtp.9.dylib libusb-1.0.0.dylib; do
            cp -f "$SRCROOT/../Vendor/$lib" "$DEST/$lib"
            # Signer chaque bibliothèque séparément. Une signature « --deep »
            # appliquée à l'application entière écraserait les entitlements de
            # l'extension, qui refuserait alors de se charger.
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/$lib"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieumartin.BrailliantConnect.FileProvider
        CODE_SIGN_ENTITLEMENTS: FileProviderExtension/FileProviderExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FileProviderExtension/Info.plist
        # Le sandbox est obligatoire pour une extension. Xcode le retire parfois
        # en propageant les entitlements de l'app hôte au moment de l'embarquement.
        ENABLE_APP_SANDBOX: YES
        # Xcode 16+ déporte le code dans une « debug dylib » et ne laisse qu'un
        # lanceur dans le binaire. Le système cherche la classe principale d'une
        # extension DANS son binaire : sans cela, il ne la trouve pas et renvoie
        # providerNotFound (-2001).
        ENABLE_DEBUG_DYLIB: NO
        # En-têtes du shim C exposant libmtp à Swift.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../Sources/CMTP
        # libmtp est fournie par son chemin : son nom de fichier ne suit pas
        # la convention -lmtp attendue par le linker.
        OTHER_LDFLAGS: $(SRCROOT)/../Vendor/libmtp.9.dylib
        # Les bibliothèques voyagent dans Contents/Frameworks de l'application ;
        # depuis l'extension, il faut remonter jusqu'à ce dossier.
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../../../../Frameworks

schemes:
  BrailliantConnect:
    build:
      targets:
        BrailliantConnect: all
        FileProviderExtension: all
    run:
      config: Debug
      executable: BrailliantConnect
